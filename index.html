<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Happy Birthday, Vova!</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body {
    width:100%; height:100%; overflow:hidden;
    background:#141024;
    font-family:'Courier New', monospace;
    touch-action:none;
    -webkit-user-select:none; user-select:none;
  }
  #wrap {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
  }
  #game { position:relative; }
  canvas {
    display:block;
    image-rendering:pixelated;
    image-rendering:crisp-edges;
    background:#2a7a2a;
  }
  /* --- фиксированная панель с репликами --- */
  #dialog {
    position:absolute;
    /* fixed size — the box never resizes or reflows when the text changes */
    width:min(290px, calc(100vw - 28px));
    background:#fffef0;
    color:#181818;
    border:3px solid #181818;
    box-shadow:4px 4px 0 rgba(0,0,0,.45);
    padding:9px 12px;
    font-weight:bold;
    font-size:15px;
    line-height:1.35;
    text-align:center;
    transform:translate(-50%,-100%);
    pointer-events:none;
    z-index:5;
    display:none;
  }
  #dialog .nm { color:#a02020; display:block; margin-bottom:4px; font-size:12px; letter-spacing:1px; }
  #dialog .tx { display:flex; align-items:center; justify-content:center; height:5.4em; }
  #dialog::after {
    content:'';
    position:absolute;
    left:50%; bottom:-9px;
    width:10px; height:10px;
    margin-left:-5px;
    background:#fffef0;
    border-right:3px solid #181818;
    border-bottom:3px solid #181818;
    transform:rotate(45deg);
  }
  /* --- HUD --- */
  #hud {
    position:absolute;
    top:calc(8px + env(safe-area-inset-top, 0px));
    left:calc(8px + env(safe-area-inset-left, 0px));
    background:rgba(20,16,36,.85);
    color:#ffe066;
    border:3px solid #ffe066;
    box-shadow:3px 3px 0 rgba(0,0,0,.5);
    padding:6px 12px;
    font-weight:bold; font-size:15px;
    z-index:6;
  }
  #hint {
    position:absolute;
    top:calc(8px + env(safe-area-inset-top, 0px));
    right:calc(8px + env(safe-area-inset-right, 0px));
    background:rgba(20,16,36,.85);
    color:#fff;
    border:3px solid #888;
    padding:6px 12px;
    font-weight:bold; font-size:13px;
    z-index:6;
    max-width:min(260px, 60vw);
    display:none;
  }
  /* --- титульный экран --- */
  #intro {
    position:absolute; inset:0;
    background:rgba(10,8,20,.92);
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    z-index:20;
    color:#fff;
    padding:20px;
  }
  #intro h1 {
    color:#ffe066;
    font-size:clamp(22px, 5vw, 44px);
    letter-spacing:2px;
    text-shadow:4px 4px 0 #a02020;
    margin-bottom:16px;
  }
  #intro p {
    font-size:clamp(13px, 2.5vw, 18px);
    margin:6px 0;
    max-width:560px;
    line-height:1.5;
  }
  #intro .start {
    margin-top:26px;
    font-size:clamp(15px, 3vw, 22px);
    color:#141024;
    background:#ffe066;
    border:4px solid #fff;
    box-shadow:5px 5px 0 rgba(0,0,0,.6);
    padding:12px 26px;
    font-weight:bold;
    cursor:pointer;
    animation:blink 1s steps(2) infinite;
  }
  @keyframes blink { 50% { opacity:.55; } }
  /* --- финал --- */
  #finale {
    position:absolute; inset:0;
    display:none;
    flex-direction:column;
    align-items:center; justify-content:center;
    text-align:center;
    z-index:15;
    pointer-events:none;
  }
  #finale h1 {
    color:#ffe066;
    font-size:clamp(26px, 8vw, 56px);
    letter-spacing:3px;
    line-height:1.15;
    padding:0 12px;
    /* shadow offsets in em so they scale with the font on small screens */
    text-shadow:0.06em 0.06em 0 #a02020, 0.12em 0.12em 0 rgba(0,0,0,.4);
    animation:pulse 0.8s ease-in-out infinite alternate;
  }
  #finale p {
    color:#fff;
    font-size:clamp(14px, 3vw, 22px);
    margin-top:14px;
    font-weight:bold;
    text-shadow:2px 2px 0 #000;
  }
  #finale img {
    margin-top:14px;
    width:min(46vw, 42vh, 240px);
    border:4px solid #fff;
    box-shadow:5px 5px 0 rgba(0,0,0,.55);
  }
  #mute {
    position:absolute;
    bottom:calc(10px + env(safe-area-inset-bottom, 0px));
    right:calc(10px + env(safe-area-inset-right, 0px));
    background:rgba(20,16,36,.85);
    color:#fff;
    border:3px solid #888;
    padding:8px 13px;
    font-size:20px;
    z-index:7;
    cursor:pointer;
  }
  @keyframes pulse { from { transform:scale(1); } to { transform:scale(1.07); } }
  /* --- виртуальный джойстик --- */
  #joy {
    position:absolute;
    width:110px; height:110px;
    border:3px solid rgba(255,255,255,.5);
    border-radius:50%;
    background:rgba(255,255,255,.08);
    display:none;
    z-index:10;
    pointer-events:none;
  }
  #joyStick {
    position:absolute;
    width:46px; height:46px;
    left:50%; top:50%;
    margin:-23px 0 0 -23px;
    border-radius:50%;
    background:rgba(255,224,102,.85);
    border:3px solid #fff;
  }
</style>
</head>

// L-shaped path, 2 tiles wide, only over grass
function carve(x1,y1,x2,y2){
  const seg=(ax,ay,bx,by)=>{
    const dx=Math.sign(bx-ax), dy=Math.sign(by-ay);
    let x=ax,y=ay;
    while(true){
      for(const [ox,oy] of [[0,0],[dx===0?1:0,dy===0?1:0]]){
        if(tileAt(x+ox,y+oy)===G_GRASS) setT(x+ox,y+oy,G_PATH);
      }
      if(x===bx&&y===by) break;
      x+=dx; y+=dy;
    }
  };
  seg(x1,y1,x2,y1); seg(x2,y1,x2,y2);
}

// build one 16x16 canvas from a template + palette + extra pixels
function spriteFrame(tpl, pal, extra){
  const c=document.createElement('canvas'); c.width=16; c.height=16;
  const g=c.getContext('2d');
  for(let y=0;y<16;y++) for(let x=0;x<16;x++){
    const ch=tpl[y][x];
    if(ch==='.') continue;
    let col=pal[ch];
    if(ch==='h' && !pal.h) continue;      // no hat brim -> skip
    if(!col) col=pal.T;
    g.fillStyle=col; g.fillRect(x,y,1,1);
  }
  if(extra) for(const [x,y,col] of extra){ g.fillStyle=col; g.fillRect(x,y,1,1); }
  return c;
}
// pal: {S,H,h,T,t,L,B,O} ; extras: {down:[],up:[],side:[]}
function buildChar(pal, extras={}){
  pal.O = pal.O || '#181820';
  return {
    down:[spriteFrame(TPL.downA,pal,extras.down), spriteFrame(TPL.downB,pal,extras.down)],
    up:  [spriteFrame(TPL.upA,pal,extras.up),     spriteFrame(TPL.upB,pal,extras.up)],
    side:[spriteFrame(TPL.sideA,pal,extras.side), spriteFrame(TPL.sideB,pal,extras.side)],
  };
}

const joy={active:false, id:null, bx:0, by:0, vx:0, vy:0};
const joyEl=document.getElementById('joy'), joyStick=document.getElementById('joyStick');
function joyStart(t){
  joy.active=true; joy.id=t.identifier; joy.bx=t.clientX; joy.by=t.clientY;
  joyEl.style.display='block';
  joyEl.style.left=(t.clientX-55)+'px'; joyEl.style.top=(t.clientY-55)+'px';
  joyStick.style.transform='translate(0,0)';
  joy.vx=0; joy.vy=0;
}
function joyMove(t){
  let dx=t.clientX-joy.bx, dy=t.clientY-joy.by;
  let len=Math.hypot(dx,dy);
  const max=38;
  if(len>max){ dx=dx/len*max; dy=dy/len*max; len=max; }
  joyStick.style.transform=`translate(${dx}px,${dy}px)`;
  const dead=7;
  if(len<=dead){ joy.vx=0; joy.vy=0; return; }
  // ramp from 0 at the dead zone edge, so there is no jump when the finger starts moving
  const mag=(len-dead)/(max-dead);
  joy.vx=dx/len*mag; joy.vy=dy/len*mag;
}
function joyEnd(){
  joy.active=false; joy.id=null; joy.vx=0; joy.vy=0;
  joyEl.style.display='none';
}
addEventListener('touchstart',e=>{
  if(!started) return;
  if(e.target && e.target.id==='mute') return;
  if(!joy.active) joyStart(e.changedTouches[0]);
  e.preventDefault();
},{passive:false});
addEventListener('touchmove',e=>{
  if(!joy.active) return;
  for(const t of e.changedTouches) if(t.identifier===joy.id) joyMove(t);
  e.preventDefault();
},{passive:false});
addEventListener('touchend',e=>{
  for(const t of e.changedTouches) if(t.identifier===joy.id) joyEnd();
},{passive:false});
addEventListener('touchcancel',joyEnd,{passive:false});

function inputVec(){
  let x=0,y=0;
  if(keys['KeyW']||keys['ArrowUp']) y-=1;
  if(keys['KeyS']||keys['ArrowDown']) y+=1;
  if(keys['KeyA']||keys['ArrowLeft']) x-=1;
  if(keys['KeyD']||keys['ArrowRight']) x+=1;
  x+=joy.vx; y+=joy.vy;
  const len=Math.hypot(x,y);
  if(len>1){ x/=len; y/=len; }
  return [x,y];
}

function solidAt(px,py){
  return SOLID.has(tileAt(Math.floor(px/TILE), Math.floor(py/TILE)));
}
function boxBlocked(x,y){
  // feet box: x±5, y+1..y+7
  const pts=[[x-5,y+1],[x+5,y+1],[x-5,y+7],[x+5,y+7]];
  for(const [px,py] of pts) if(solidAt(px,py)) return true;
  for(const n of npcs){
    const dx=x-n.x, dy=(y+4)-(n.y+4);
    if(dx*dx+dy*dy < 11*11) return true;
  }
  if(cake.spawned && !cake.reached){
    // cake itself is not solid - walking onto it triggers the finale
  }
  return false;
}
const SPEED=78;
let smX=0, smY=0;              // smoothed input, kills joystick jitter
function movePlayer(dt){
  const [rx,ry]=inputVec();
  const k=Math.min(1, dt*16);
  smX+=(rx-smX)*k; smY+=(ry-smY)*k;
  if(Math.abs(smX)<0.03) smX=0;
  if(Math.abs(smY)<0.03) smY=0;
  const ix=smX, iy=smY;
  player.moving = (ix!==0||iy!==0);
  if(player.moving){
    // hysteresis: keep the current facing axis unless the other clearly dominates,
    // otherwise the sprite flickers between side/up-down when moving diagonally
    const ax=Math.abs(ix), ay=Math.abs(iy);
    let horiz = player.dir==='side';
    if(horiz){ if(ay > ax*1.45) horiz=false; }
    else     { if(ax > ay*1.45) horiz=true; }
    if(horiz){ player.dir='side'; player.flip=ix<0; }
    else player.dir = iy<0 ? 'up' : 'down';
    const nx=player.x+ix*SPEED*dt, ny=player.y+iy*SPEED*dt;
    if(!boxBlocked(nx,player.y)) player.x=nx;
    if(!boxBlocked(player.x,ny)) player.y=ny;
    player.animT+=dt;
    if(player.animT>0.16){ player.animT=0; player.frame=1-player.frame; }
  } else { player.frame=0; player.animT=0; }
}

/* ================= NPC / BUBBLES / PROGRESS ================= */
const hudEl=document.getElementById('hud');
const hintEl=document.getElementById('hint');
let hintTimer=null;
function showHint(msg,ms){
  hintEl.textContent=msg; hintEl.style.display='block';
  clearTimeout(hintTimer);
  if(ms) hintTimer=setTimeout(()=>hintEl.style.display='none',ms);
}
function updateHUD(){
  hudEl.textContent = `🎉 Greetings: ${greetCount}/${npcs.length}`;
}
function faceToPlayer(n){
  const dx=player.x-n.x, dy=player.y-n.y;
  if(Math.abs(dx)>Math.abs(dy)){ n.dir='side'; n.flip=dx<0; }
  else n.dir = dy<0 ? 'up' : 'down';
}
const TALK_R=42, PHRASE_MS=3.8;
const dialogEl=document.getElementById('dialog');
let talking=null;              // the single NPC currently speaking
function updateNPCs(dt){
  // pick the nearest NPC in range — only one speaks at a time
  let best=null, bestD=Infinity;
  for(const n of npcs){
    n.bob+=dt*2.2;
    const dx=player.x-n.x, dy=player.y-n.y, d=dx*dx+dy*dy;
    if(d<TALK_R*TALK_R && d<bestD){ best=n; bestD=d; }
  }
  if(best!==talking){
    if(talking){ talking.active=false; talking.dir=talking.homeDir; talking.flip=talking.homeFlip; }
    talking=best;
    if(talking){
      talking.active=true; talking.phraseT=0;
      dialogEl.style.display='block';
      setBubbleText(talking);
      placeDialog();
      jingle(talking.cfg.id);
      if(!talking.greeted){
        talking.greeted=true; greetCount++; updateHUD();
        if(greetCount===npcs.length) spawnCake();
      }
    } else {
      dialogEl.style.display='none';
    }
  }
  if(talking){
    faceToPlayer(talking);
    talking.phraseT+=dt;
    if(talking.phraseT>PHRASE_MS){
      talking.phraseT=0;
      talking.phraseIdx=(talking.phraseIdx+1)%talking.cfg.phrases.length;
      setBubbleText(talking);
    }
  }
}
function setBubbleText(n){
  dialogEl.innerHTML = `<span class="nm">${n.cfg.name} · ${n.cfg.zone}</span><span class="tx">${n.cfg.phrases[n.phraseIdx]}</span>`;
}
// anchored above the NPC; recomputed only when the camera actually moved
let dlgCamX=null, dlgCamY=null;
function placeDialog(){
  if(!talking) return;
  const w=dialogEl.offsetWidth||290, half=w/2+6;
  const cssW=VIEW_W*cssScale;
  let sx=(talking.x-camX)*cssScale, sy=(talking.y-13-camY)*cssScale;
  sx=Math.max(half, Math.min(cssW-half, sx));
  sy=Math.max(dialogEl.offsetHeight+14, sy);
  dialogEl.style.left=Math.round(sx)+'px';
  dialogEl.style.top=Math.round(sy)+'px';
  dlgCamX=camX; dlgCamY=camY;
}
function spawnCake(){
  cake.spawned=true;
  showHint('🎂 A cake appeared in the center of the map! Go get it!');
}
function checkCake(){
  if(!cake.spawned||cake.reached) return;
  const cx=(CAKE_T.x+0.5)*TILE, cy=(CAKE_T.y+0.5)*TILE;
  const dx=player.x-cx, dy=player.y-cy;
  if(dx*dx+dy*dy < 22*22){
    cake.reached=true;
    hintEl.style.display='none';
    dialogEl.style.display='none';
    talking=null;
    document.getElementById('finale').style.display='flex';
    fireworksOn=true;
  }
}

/* ================= RENDER: CHARACTERS ================= */
function drawChar(spr,e,isPlayer){
  // round in WORLD space, then subtract the integer camera — keeps sprites from
  // shimmering against the background when the camera scrolls
  const x=Math.round(e.x)-camX, y=Math.round(e.y)-camY;
  ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(x-5,y+6,10,2);
  const frame = isPlayer ? (e.moving?e.frame:0) : 0;
  const yoff = (!isPlayer && e.active) ? -(Math.floor(gameT*5)%2) : 0;
  const img = spr[e.dir][frame];
  if(e.dir==='side' && e.flip){
    ctx.save(); ctx.translate(x,y+yoff); ctx.scale(-1,1);
    ctx.drawImage(img,-8,-8); ctx.restore();
  } else {
    ctx.drawImage(img,x-8,y-8+yoff);
  }
}

// decorative crowd: small looping animations, no collisions
function drawAmbient(a){
  const x=Math.round(a.x)-camX, y=Math.round(a.y)-camY;
  let xo=0, yo=0;
  switch(a.kind){
    case 'spar': { const l=(Math.floor(gameT*2.4)+a.phase)%2===0?2:0; xo=a.flip?-l:l; break; }
    case 'pull': yo=Math.round(Math.sin(gameT*2.0+a.phase)*3); break;
    case 'dip':  yo=Math.sin(gameT*2.6+a.phase)>0?-2:0; break;
    case 'type': yo=(Math.floor(gameT*5+a.phase)%5===0)?-1:0; break;
    case 'sit': case 'sitfull': yo=Math.sin(gameT*1.4+a.phase)>0.86?-1:0; break;
    case 'pong': { const s=Math.sin(gameT*2.6); const hit=a.flip? s>0.75 : s<-0.75;
                   const l=hit?2:0; xo=a.flip?-l:l; break; }
    case 'monkey': xo=Math.round(Math.sin(gameT*0.9+a.phase)*16);
                   yo=(Math.floor(gameT*3)%2)?-1:0; break;
  }
  const img=AMB_SPR[a.spr][a.dir][0];
  if(a.kind==='pull'||a.kind==='monkey'){ // arms reaching up to the bar
    const by=Math.round(a.barY-camY), top=y-8+yo;
    ctx.fillStyle=SKIN;
    ctx.fillRect(x+xo-4,by+1,1,Math.max(2,top-by+2));
    ctx.fillRect(x+xo+3,by+1,1,Math.max(2,top-by+2));
  } else if(a.kind!=='sit'){
    ctx.fillStyle='rgba(0,0,0,.28)'; ctx.fillRect(x-5+xo,y+6,10,2);
  }
  if(a.kind==='sit'){ // only head+torso, hidden behind the table
    ctx.drawImage(img,0,0,16,11,x-8,y-8+yo,16,11);
  } else if(a.dir==='side'&&a.flip){
    ctx.save(); ctx.translate(x+xo,y+yo); ctx.scale(-1,1);
    ctx.drawImage(img,-8,-8); ctx.restore();
  } else {
    ctx.drawImage(img,x-8+xo,y-8+yo);
  }
}

/* ================= FIREWORKS ================= */
let parts=[], fwT=0;
const FW_COLORS=['#ffe066','#ff6a6a','#6ad0ff','#8aff8a','#ff9cf0','#ffb347'];
function burst(x,y){
  const col=FW_COLORS[Math.floor(Math.random()*FW_COLORS.length)];
  for(let i=0;i<26;i++){
    const a=Math.random()*6.283, sp=26+Math.random()*66;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:0.8+Math.random()*0.7,col});
  }
}
function updateFireworks(dt){
  if(fireworksOn){
    fwT-=dt;
    if(fwT<=0){ fwT=0.42; burst(30+Math.random()*(VIEW_W-60), 25+Math.random()*110); }
  }
  for(const p of parts){ p.vy+=30*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }
  parts=parts.filter(p=>p.life>0);
}
function drawFireworks(){
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life*1.6));
    ctx.fillStyle=p.col; ctx.fillRect(p.x-1,p.y-1,2,2);
  }
  ctx.globalAlpha=1;
}

/* ================= MAIN RENDER ================= */
function render(){
  camX=Math.round(Math.max(0,Math.min(player.x-VIEW_W/2, MAP_W*TILE-VIEW_W)));
  camY=Math.round(Math.max(0,Math.min(player.y-VIEW_H/2, MAP_H*TILE-VIEW_H)));
  const tx0=Math.floor(camX/TILE), ty0=Math.floor(camY/TILE);
  const tx1=Math.min(MAP_W-1,Math.floor((camX+VIEW_W)/TILE));
  const ty1=Math.min(MAP_H-1,Math.floor((camY+VIEW_H)/TILE));
  for(let ty=ty0;ty<=ty1;ty++)
    for(let tx=tx0;tx<=tx1;tx++)
      drawTile(tx,ty, tx*TILE-camX, ty*TILE-camY);
  drawDecor();
  const chars=npcs.map(n=>({y:n.y, d:()=>drawChar(SPRITES[n.cfg.id],n,false)}));
  chars.push({y:player.y, d:()=>drawChar(SPRITES.player,player,true)});
  for(const a of AMBIENT) chars.push({y:a.y, d:()=>drawAmbient(a)});
  chars.sort((a,b)=>a.y-b.y);
  for(const c of chars) c.d();
  drawFireworks();
  // keep the dialog anchored to its NPC while the camera scrolls
  if(talking && (camX!==dlgCamX || camY!==dlgCamY)) placeDialog();
}

/* ================= 8-BIT AUDIO ================= */
let AC=null, audioOn=true;
let musIdx=0, musNext=0, bassIdx=0, bassNext=0, hbIdx=0, hbNext=0;
const NOTE=n=>440*Math.pow(2,(n-69)/12);
function beep(freq,t0,dur,type,vol){
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'square'; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||0.05,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(t0); o.stop(t0+dur+0.02);
}
// background loop, 16 beats [midi, beats]; 0 = rest
const BEAT=0.4;
const BG_TUNE=[
  [64,.5],[67,.5],[69,.5],[67,.5],[64,.5],[62,.5],[60,1],
  [62,.5],[64,.5],[65,.5],[64,.5],[62,.5],[60,.5],[62,1],
  [64,.5],[67,.5],[69,.5],[71,.5],[72,1],[71,.5],[69,.5],
  [67,1],[69,.5],[67,.5],[64,.5],[62,.5],[60,1],
];
const BG_BASS=[[48,1],[52,1],[55,1],[52,1]];
// Happy Birthday [midi, beats]
const HBEAT=0.45;
const HB=[
  [67,.75],[67,.25],[69,1],[67,1],[72,1],[71,2],
  [67,.75],[67,.25],[69,1],[67,1],[74,1],[72,2],
  [67,.75],[67,.25],[79,1],[76,1],[72,1],[71,1],[69,2],
  [77,.75],[77,.25],[76,1],[72,1],[74,1],[72,2],[0,2],
];
function musicTick(){
  if(!AC||!audioOn) return;
  const ahead=AC.currentTime+0.35;
  if(cake.reached){
    if(hbNext<AC.currentTime) hbNext=AC.currentTime+0.1;
    while(hbNext<ahead){
      const [n,d]=HB[hbIdx];
      if(n){ beep(NOTE(n),hbNext,d*HBEAT*0.9,'square',0.05);
             beep(NOTE(n-12),hbNext,d*HBEAT*0.9,'triangle',0.05); }
      hbNext+=d*HBEAT; hbIdx=(hbIdx+1)%HB.length;
    }
  } else {
    while(musNext<ahead){
      const [n,d]=BG_TUNE[musIdx];
      if(n) beep(NOTE(n),musNext,d*BEAT*0.85,'square',0.032);
      musNext+=d*BEAT; musIdx=(musIdx+1)%BG_TUNE.length;
    }
    while(bassNext<ahead){
      const [n,d]=BG_BASS[bassIdx];
      beep(NOTE(n),bassNext,d*BEAT*0.9,'triangle',0.05);
      bassNext+=d*BEAT; bassIdx=(bassIdx+1)%BG_BASS.length;
    }
  }
}
function initAudio(){
  if(AC) return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    musNext=bassNext=AC.currentTime+0.15;
    setInterval(musicTick,150);
  }catch(e){ AC=null; }
}
// short zone jingles: [midi, delay s, dur s]
const JINGLES={
  cpp:     [[76,0,.08],[81,.09,.08],[88,.18,.14]],
  math:    [[60,0,.1],[64,.1,.1],[67,.2,.1],[72,.3,.18]],
  box:     [[45,0,.12],[40,.15,.18]],
  mafia:   [[57,0,.14],[55,.16,.14],[53,.32,.14],[52,.48,.22]],
  onepiece:[[55,0,.1],[59,.1,.1],[62,.2,.1],[67,.3,.2]],
  turnik:  [[48,0,.1],[48,.12,.1],[55,.24,.18]],
  tennis:  [[86,0,.05],[81,.18,.05]],
};
function jingle(id){
  if(!AC||!audioOn) return;
  const t=AC.currentTime;
  for(const [n,dt,d] of JINGLES[id]||[]) beep(NOTE(n),t+dt,d,'square',0.07);
}
const muteEl=document.getElementById('mute');
muteEl.addEventListener('pointerdown',e=>{
  e.stopPropagation(); e.preventDefault();
  audioOn=!audioOn;
  muteEl.textContent=audioOn?'🔊':'🔇';
  if(AC){ audioOn?AC.resume():AC.suspend(); }
});

/* ================= LOOP / INIT ================= */
function resize(){
  // full-screen canvas: zoom from the smaller screen side, internal size matches aspect
  cssScale = Math.max(1, Math.round(Math.min(innerWidth, innerHeight)/220));
  // keep both sides EVEN: VIEW_W/2 must be a whole pixel, otherwise the camera
  // centre lands on a half pixel and the player sprite wobbles by 1px while walking
  VIEW_W = Math.ceil(innerWidth/cssScale/2)*2;
  VIEW_H = Math.ceil(innerHeight/cssScale/2)*2;
  cv.width=VIEW_W; cv.height=VIEW_H;              // resets context state
  cv.style.width=(VIEW_W*cssScale)+'px';
  cv.style.height=(VIEW_H*cssScale)+'px';
  ctx.imageSmoothingEnabled=false;
}
addEventListener('resize',resize);
addEventListener('orientationchange',()=>setTimeout(resize,120));
resize();

let last=performance.now();
function loop(now){
  const dt=Math.min(0.05,(now-last)/1000); last=now;
  gameT+=dt;
  if(started){
    movePlayer(dt);
    updateNPCs(dt);
    checkCake();
  }
  updateFireworks(dt);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

const introEl=document.getElementById('intro');
function startGame(){
  if(started) return;
  started=true;
  initAudio();
  introEl.style.display='none';
  showHint('Walk up to the guests — they all want to greet you!', 6000);
}
// start on ANY tap/click anywhere in the document — most reliable across phones
function tryStart(e){ if(started) return; e.preventDefault(); startGame(); }
for(const ev of ['touchend','pointerup','click'])
  document.addEventListener(ev,tryStart,{passive:false});
addEventListener('keydown',e=>{ if(e.code==='Enter'||e.code==='Space') startGame(); });
